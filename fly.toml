# fly.toml app configuration file generated for delphi-2vir0g on 2026-07-20T23:12:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'delphi-2vir0g'
primary_region = 'ams'

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Without this a deploy reports success whatever happens afterwards. That is
  # exactly how the disk-full outage went unnoticed: the image built, the
  # machine started, flyctl said "✔ Machine is now in a good state" — and the
  # app had already crashed on being unable to open its database, so nothing
  # was listening and every request got a 503.
  #
  # grace_period is generous on purpose. Startup seeds the source catalog and
  # runs migrations before uvicorn binds, which on a cold volume takes tens of
  # seconds; a short grace here would turn a slow boot into a restart loop,
  # which is worse than the problem being solved.
  [[http_service.checks]]
    grace_period = '60s'
    interval = '30s'
    timeout = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  # Delphi's poller is a *sustained* workload — it never idles — and Fly
  # throttles shared CPUs hard once the burst allowance is spent, which is what
  # made the dashboard crawl on shared-cpu-1x. Two shared vCPUs and 2 GB give
  # ingestion room to run while the app stays responsive.
  #
  # Still not fast enough? Change size to 'performance-1x' for a *dedicated*
  # core with no throttling (costs several times more, but it is the right
  # answer for continuous ingestion at this catalog size).
  #
  # Keep count at 1 — the scheduler, SQLite database, and rate limiter are all
  # in-process. Scale this machine up, never out.
  size = 'shared-cpu-2x'
  memory = '2048mb'
