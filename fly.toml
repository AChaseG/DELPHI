# Fly.io config — deploy with:
#   fly launch --copy-config --no-deploy   (pick an app name when prompted)
#   fly volumes create newsdata --size 1
#   fly deploy
app = "delphi-news"
primary_region = "iad"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always on so ingestion and alerts run 24/7.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "newsdata"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
